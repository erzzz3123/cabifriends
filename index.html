<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabi &amp; Friends — People, places &amp; food we love across Japan</title>
<link rel="stylesheet" href="/_ds/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/tokens/colors.css">
<link rel="stylesheet" href="/_ds/tokens/typography.css">
<link rel="stylesheet" href="/_ds/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/tokens/friends.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<script src="/assets/d3.min.js"></script>
<script src="/assets/topojson-client.min.js"></script>
<script>window.CF_API='/api';</script>
<!-- Bundled data first (REGIONS, FAMILIES + fallback Friends); live /api/data then replaces FRIENDS and PREFS. -->
<script src="/data.js"></script>
<script src="/api/data"></script>
<script src="/i18n.js"></script>
<script src="/assets/japan-topo.js"></script>
<style>
:root{--font-mono-jp:"FT Blank Mono","DM Mono",ui-monospace,Menlo,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",monospace;--font-mono:var(--font-mono-jp);--ink:var(--cf-black);--bone:var(--cf-bone);--soft:var(--cf-rule-soft);--hov:var(--cf-hover);--mute:rgba(67,47,41,.74);--pad:40px}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF}
body>.util,body>.hd,body>#root,body>.ft{zoom:.9}
html:root,html [data-theme="friends"],body[data-theme="friends"]{--bone:#FFFFFF;--cf-bone:#FFFFFF}
button,input,select,textarea{font-family:inherit;text-transform:inherit;letter-spacing:inherit}
@font-face{font-family:"Ginto Local";src:url("/fonts/Ginto-Light.ttf") format("truetype");font-weight:100 900;font-display:swap}
[data-theme="friends"]{--font-mono-jp:"Ginto Local","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;--font-mono:var(--font-mono-jp);--bone:#fff}
[data-theme="friends-old"]{--font-mono-jp:"FT Blank Mono","DM Mono",ui-monospace,Menlo,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",monospace}
body{background:#fff;color:var(--ink);font-family:var(--font-mono-jp);font-weight:300;text-transform:uppercase;letter-spacing:.02em;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
::selection{background:var(--ink);color:var(--bone)}
button{font:inherit;color:inherit}
.wrap{padding-left:var(--pad);padding-right:var(--pad)}
.meta{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.ui{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.mute{color:var(--mute)}
.lnk{cursor:pointer;background:none;border:0;padding:0;text-align:left}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* sister-site bar */
.util{display:flex;align-items:stretch;justify-content:space-between;border-bottom:1px solid var(--ink);height:30px}
.util .tabs{display:flex}
.util a{white-space:nowrap;display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--ink);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.util a:hover{background:var(--hov);text-decoration:none}
.util a.on{background:var(--ink);color:var(--bone)}
.util .lang{display:flex;align-items:center;gap:8px;padding:0 var(--pad) 0 14px;font-size:11px;letter-spacing:.06em}
.util .lang span{color:var(--mute)}
.util .lang button{background:none;border:0;padding:0;cursor:pointer;color:var(--mute);font-size:inherit;letter-spacing:inherit}
.util .lang button:hover{color:var(--ink)}
.util .lang button.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.util .url{display:flex;align-items:center;padding:0 var(--pad) 0 14px;font-size:11px;letter-spacing:.06em;color:var(--mute)}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.logo{display:block;width:96px;height:72px;background:url("/assets/cabi-friends-black.png") center/214px auto no-repeat;flex:none}
.logo:hover{opacity:.85}
.nav{display:flex;gap:28px;align-items:center}
.nav a{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;padding:4px 0;border-bottom:1px solid transparent}
.nav a:hover{text-decoration:none;border-bottom-color:var(--ink)}
.nav a.on{border-bottom-color:var(--ink)}
.nav .sep{width:1px;height:14px;background:var(--soft)}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding-top:32px;padding-bottom:24px;align-items:end}
.intro h1{margin:0;font-weight:300;font-size:46px;line-height:1.08;letter-spacing:-.02em;max-width:22ch;text-wrap:balance}
.intro aside{display:grid;gap:10px;padding-bottom:6px}
.intro aside .jp{font-size:14px}

/* search + controls */
.search{display:flex;align-items:center;gap:16px;flex:1;min-width:240px}
.search input{flex:1;min-width:0;font-family:inherit;font-weight:300;font-size:20px;padding:8px 0;border:0;background:transparent;color:var(--ink);outline:none}
.search input::placeholder{color:rgba(67,47,41,.45)}
.search .k{font-size:11px;border:1px solid var(--soft);padding:2px 7px;color:var(--mute)}
.search .clr{cursor:pointer;background:none;border:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.count{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.count b{font-weight:400;font-size:20px;letter-spacing:.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:40px;display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--bone);border:0;padding:6px 8px 4px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip:hover{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{white-space:nowrap;background:none;border:0;padding:8px 14px;cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.seg button+button{border-left:1px solid var(--ink)}
.seg button:hover{background:var(--hov)}
.seg button.on{background:var(--ink);color:var(--bone)}
.seg.sm button{padding:6px 10px;font-size:11px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bone);border:1px solid var(--ink);padding:8px 14px;cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;text-decoration:none}
.btn:hover{background:transparent;color:var(--ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bone)}

/* tags */
.tags{border-top:1px solid var(--soft)}
.trow{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--soft);align-items:start}
.trow>.meta{padding-top:6px}
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tag{white-space:nowrap;display:inline-flex;align-items:baseline;gap:5px;background:none;border:1px solid rgba(67,47,41,.35);padding:6px 11px 4px;border-radius:40px;cursor:pointer;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:400;transition:background .15s,color .15s,border-color .15s}
.tag i{font-style:normal;font-size:10px;color:var(--mute)}
.tag:hover{border-color:var(--ink);background:var(--hov)}
.tag.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.tag.on i{color:var(--bone)}
.tag .ja{font-size:11px;letter-spacing:0;text-transform:none}

/* directory */
.dhead,.row{display:grid;grid-template-columns:52px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1.2fr) 70px;gap:20px;align-items:baseline}
.dhead{padding:18px 0 8px;border-bottom:1px solid var(--ink)}
.row{padding:14px 12px;margin:0 -12px;border-bottom:1px solid var(--soft);cursor:pointer;transition:opacity .15s,background .15s}
.row:hover{background:var(--hov)}
.row.dim{opacity:.22}
.row .no{font-size:11px;letter-spacing:.06em;color:var(--mute)}
.nm{display:grid;gap:2px}
.nm .en{font-size:17px;font-weight:400;line-height:1.25}
.nm .ja{font-size:13px;color:var(--mute)}
.pl{position:relative;font-size:13px}
.pl span{display:block;transition:opacity .18s}
.pl .b{position:absolute;inset:0 auto auto 0;opacity:0;white-space:nowrap}
.row:hover .pl .a{opacity:0}
.row:hover .pl .b{opacity:1}
.mk{font-size:14px}
.rt{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.rt button{background:none;border:0;padding:0;cursor:pointer;font-size:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mute)}
.rt button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.row .since{font-size:11px;letter-spacing:.06em;color:var(--mute);text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 16px;padding-top:24px;padding-bottom:12px;border-top:1px solid var(--ink)}
.card{display:grid;align-content:start;gap:10px;cursor:pointer;transition:opacity .15s}
.card.dim{opacity:.22}
.card .thumb{container-type:size;position:relative;aspect-ratio:891/952;overflow:hidden;border-radius:5px;background:rgba(67,47,41,.09)}
.card .thumb img,.card .thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.card .thumb .lbl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card .thumb .kj{position:absolute;inset:34px 0 48px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:min(30px,calc((100cqh - 90px) / 6.4));line-height:1;letter-spacing:.04em;color:rgba(67,47,41,.55);writing-mode:vertical-rl;transition:opacity .2s}
.card .thumb .no{position:absolute;left:8px;top:8px;background:var(--bone);padding:2px 7px;border-radius:40px;font-size:10px;letter-spacing:.06em;z-index:2}
.card .thumb .hv{position:absolute;inset:0;background:var(--ink);color:var(--bone);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;font-size:12px;line-height:1.4;opacity:0;transition:opacity .2s}
.card:hover .thumb .hv{opacity:.94}
.card h2{margin:0;font-weight:400;font-size:17px;line-height:1.2;position:relative}
.card h2 .en,.card h2 .ja{display:block;transition:opacity .18s}
.card h2 .ja{position:absolute;inset:0;opacity:0;font-weight:300}
.card:hover h2 .en{opacity:0}
.card:hover h2 .ja{opacity:1}
.card .ct{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin:0;padding:0;list-style:none}
.card .ct button{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mute)}
.card .ct button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.card .ct .pf{color:var(--ink)}
.also{padding:28px 0 8px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;border-bottom:1px solid var(--soft)}
.also .pl2{display:flex;flex-wrap:wrap;gap:8px 22px}
.also a{font-size:14px}
.empty{padding:56px 0;display:grid;gap:16px;justify-items:start;border-bottom:1px solid var(--soft)}
.empty p{margin:0;font-size:20px;max-width:34ch}

/* directory list (index style) */
.ex-row{display:flex;gap:16px 32px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:14px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.ex-row.nob{border-bottom:0}
.ex-ctl{display:flex;gap:12px 32px;flex-wrap:wrap;align-items:center}
.ex-ctl>span{display:flex;gap:18px}
.bk{background:none;border:0;padding:0;cursor:pointer;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:400;white-space:nowrap}
.bk::before{content:"[ ] ";white-space:pre}
.bk.on::before{content:"[•] "}
.bk.plain::before{content:none}
.bk:hover{text-decoration:underline;text-underline-offset:3px}
.ex-meta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:4px;font-size:13px}
.dl-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;padding-top:26px;align-items:start}
.dl{min-height:60vh;padding-left:100px}
.dl-lbl{font-style:italic;font-size:13px;margin:0 0 26px 56px}
.dl-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
.ent{display:grid;grid-template-columns:56px minmax(0,1fr);font-size:13px;line-height:1.38;transition:opacity .12s linear}
.ent .ix{font-size:12px;color:var(--mute)}
.ent .tx{position:relative;display:grid;align-content:start;cursor:pointer;justify-items:start}
.ent .tx>span{display:block}
.ent:hover .tx>span,.ent.sel .tx>span{font-style:italic}
.ent .strip{position:absolute;left:0;top:calc(100% + 8px);display:flex;gap:10px;height:64px;z-index:6;opacity:0;pointer-events:none;transition:opacity .12s linear}
.ent:hover .strip,.ent.stair .strip{opacity:1;pointer-events:auto}
.ent.stair .strip{transition:none}
.th{transform-origin:50% 0}
.th{height:100%;padding:0;border:0;background:none;cursor:pointer;display:block;flex:none}
.th img,.th video{height:100%;width:auto;display:block}
.th .ph2{display:block;height:100%}
.dl.has-sel .ent:not(.sel){opacity:.28}
.dl.has-sel .ent:not(.sel):hover{opacity:1}
.dp{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:none;display:grid;gap:10px;align-content:start}
.dp>*{opacity:0;transition:opacity .25s ease .35s}
.dp.on>*{opacity:1}
.dp.on>.dp-f.first{transition:none}
.dp.out>*{opacity:0;transition:opacity .25s ease}
.dp-h{display:flex;justify-content:space-between;gap:16px;align-items:baseline;font-size:13px;line-height:1.38;padding-bottom:4px}
.dp-h .a{display:flex;gap:18px;flex:none}
.dp-im{display:block}
.dp-im>img,.dp-im>video{width:100%;height:auto;display:block;margin:0 auto}
.dp-im>.dp-ph{width:100%;aspect-ratio:4/3;margin:0 auto}
.dp-ph{background:rgba(67,47,41,.12);color:var(--ink);display:flex !important;flex-direction:column;justify-content:space-between;padding:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.fly{position:fixed;z-index:60;pointer-events:none;margin:0}
.dp figcaption{padding-top:6px;text-align:center}
.dp-d{font-size:13px;line-height:1.5;margin:6px 0 24px;max-width:56ch}
body{transition:background-color .55s cubic-bezier(.25,.1,.25,1)}
html body.intro{background:color-mix(in oklab,var(--cf-black) 58%,#fff)}
body.intro #root,body.intro footer,body.intro .dp,body.intro .ex-row,body.intro .ex-meta{visibility:hidden}
body.intro .util,body.intro .hd>:not(.logo){visibility:hidden}
body.intro.i1 .util,body.intro.i1 .hd>:not(.logo){visibility:visible}
/* image load: flat tone block first, picture fades in once decoded */
#root img{opacity:0;transition:opacity .28s ease}
#root img.ld{opacity:1}
.th,.card .thumb{background:transparent}
/* hover photo */
#peek{position:fixed;left:0;top:0;width:220px;pointer-events:none;z-index:40;display:none;background:var(--bone);border:1px solid var(--ink);padding:6px}
#peek .ph,#peek img,#peek video{width:100%;aspect-ratio:4/5;display:block;object-fit:cover}
#peek .cap{padding:6px 2px 0;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ph{background:rgba(67,47,41,.09);display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ph .x{font-size:10px}
.photo{position:relative;background:rgba(67,47,41,.09);overflow:hidden}
.photo img,.photo video{width:100%;height:100%;object-fit:cover;display:block}
figure{margin:0}
figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;border-top:1px solid var(--ink)}
.mapbox{position:relative;border-right:1px solid var(--ink);overflow:hidden}
.mapbox svg{display:block;width:100%}
.pref{fill:var(--bone);stroke:rgba(67,47,41,.6);stroke-width:.6;cursor:pointer;transition:fill .15s}
.pref.has{fill:rgba(67,47,41,.13)}
.pref.known{fill:rgba(67,47,41,.34)}
.pref.pv{fill:rgba(67,47,41,.34)}
.pref:hover{fill:rgba(67,47,41,.24)}
.pref.sel,.pref.sel:hover{fill:var(--ink)}
.grat{stroke:rgba(67,47,41,.18);stroke-width:.6;stroke-dasharray:2 4;fill:none}
.glab{font-size:9px;letter-spacing:.06em;fill:var(--mute);font-family:var(--font-mono)}
.inset{fill:none;stroke:var(--ink);stroke-width:1}
.dot{cursor:pointer}
.dot circle{fill:var(--ink);stroke:var(--bone);stroke-width:1.5;r:4.5px;transition:r .15s,opacity .15s}
.dot:hover circle{r:8px}
.dot.insel circle{fill:var(--bone);stroke:var(--ink)}
.dot.off{opacity:.12;pointer-events:none}
.legend{position:absolute;left:16px;bottom:14px;display:grid;gap:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--bone);padding:8px 10px;border:1px solid var(--soft)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:12px;height:10px;border:.6px solid var(--ink)}
.maptools{position:absolute;right:14px;bottom:30px;display:flex;gap:6px}
.panel{padding:24px;max-height:86vh;overflow:auto;position:relative}
.panel::after{content:"↓  Scroll";position:sticky;bottom:-24px;display:flex;align-items:flex-end;justify-content:center;height:72px;margin:-72px -24px -24px;padding-bottom:12px;background:linear-gradient(rgba(255,255,255,0),#fff 70%);font-size:11px;letter-spacing:.08em;color:var(--ink);pointer-events:none;transition:opacity .2s}
html[lang="ja"] .panel::after{content:"↓  スクロール"}
.panel.end::after{opacity:0}
.dot{transition:opacity .35s ease}
.panel h2{margin:0;font-weight:300;font-size:40px;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.panel h2 .ja{display:block;font-size:24px;margin-top:6px;text-transform:none}
.plbl{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--ink);padding-top:8px;margin-top:22px;margin-bottom:10px}
.known-list{display:flex;flex-wrap:wrap;gap:6px}
.season{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;font-size:13px}
.mini-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.mini-row:hover{background:var(--hov)}
.mini-row .en{font-size:15px;font-weight:400}
.mini-row .d{font-size:12px;color:var(--mute)}
.ridx{display:grid;gap:14px}
.ridx .r{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px}
.ridx .ps{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:13px}
.ridx sup{font-size:9px;margin-left:2px}
#tip{position:fixed;z-index:50;pointer-events:none;display:none;background:var(--ink);color:var(--bone);padding:10px 12px;max-width:260px;font-size:12px;line-height:1.45}
#tip .t{font-size:13px;font-weight:400;letter-spacing:.04em;text-transform:uppercase}
#tip .s{margin-top:6px}
#tip{max-width:none;border-radius:8px}
#tip .tth{display:flex;gap:6px;height:64px;margin-top:10px}
#tip .tth img,#tip .tth video{height:100%;width:auto;display:block}
#tip .tth span{height:100%;aspect-ratio:4/5;background:rgba(255,255,255,.18)}

/* profile */
.crumbs{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.crumbs span{color:var(--mute)}
.hero{height:min(72vh,720px)}
.phead{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding-top:36px;padding-bottom:36px;border-bottom:1px solid var(--ink);align-items:end}
.phead h1{margin:0;font-weight:300;font-size:72px;line-height:1;letter-spacing:-.015em}
.phead .ja{font-size:32px;margin-top:10px;display:block}
.stamp{display:inline-grid;gap:2px;border:1px solid var(--ink);padding:10px 12px;justify-self:end;text-align:left;transform:rotate(-2deg)}
.stamp b{font-weight:400;font-size:20px}
.pgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:64px;padding-top:40px;padding-bottom:64px}
.spec{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--soft);font-size:13px}
.spec:last-child{border-bottom:1px solid var(--soft)}

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#root');
const isVid=s=>/\.(mp4|m4v|webm|mov)(\?|#|$)/i.test(s||'');
// Videos sit in the same slots as photos: large views loop silently like a moving photo, small ones show the first frame.
const media=(src,alt='',play=false)=>isVid(src)?`<video src="${src}${play?'':'#t=0.1'}" muted playsinline loop ${play?'autoplay preload="auto"':'preload="metadata"'} aria-label="${alt}"></video>`:`<img src="${src}" alt="${alt}">`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={}; PREFS.forEach((p,i)=>{p.id=i+1;P[p.slug]=p;p.friends=[];p._en=p.name_en;p._ja=p.name_ja;p._desc=p.description;p._spec=p.specialties;p._seas=p.seasonal_foods;});
window.FRIENDS=FRIENDS.filter(f=>f&&f.slug&&P[f.prefecture]);FRIENDS.forEach(f=>{['images','tags','specialties','ingredients','methods'].forEach(k=>{if(!Array.isArray(f[k]))f[k]=[];});if(!Array.isArray(f.story))f.story=f.story?[f.story]:[];if(!Array.isArray(f.story_ja))f.story_ja=f.story_ja?[f.story_ja]:[];});
const F={}; FRIENDS.forEach(f=>{f._desc=f.description||'';f._story=f.story;while(f.images.length<3)f.images.push({caption:f.name_en});f._en=f.name_en;f._ja=f.name_ja;f._makes=f.makes;f._city=f.city;f.images.forEach(im=>im._cap=im.caption);F[f.slug]=f;f.no=String(f.id).padStart(3,'0');f.region=P[f.prefecture].region;P[f.prefecture].friends.push(f.slug);});
const TOTAL=FRIENDS.length;
const TYPES=['Producer','Farmer','Restaurant','Shop','Craft'];
const foodCount={}; FRIENDS.forEach(f=>f.tags.forEach(t=>foodCount[t]=(foodCount[t]||0)+1));
const FOODS=Object.keys(foodCount).sort((a,b)=>foodCount[b]-foodCount[a]||a.localeCompare(b));
const PLACES=PREFS.filter(p=>p.friends.length);
const coord=(la,lo)=>`${Math.abs(la).toFixed(2)}°N ${Math.abs(lo).toFixed(2)}°E`;
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const hoverable=matchMedia('(hover:hover)').matches;
let LANG=localStorage.getItem('cf_lang')==='ja'?'ja':'en';
const T=(en,ja)=>LANG==='ja'?ja:en;
const tr=s=>LANG==='ja'&&s?((window.JA_TERMS||{})[s]||s):s;
const fc=n=>LANG==='ja'?`友人 ${n}`:plural(n,'Friend');
function applyLangData(){const ja=LANG==='ja';
  PREFS.forEach(p=>{p.name_en=ja?p._ja:p._en;p.name_ja=ja?p._en:p._ja;p.description=ja?((window.JA_DESC||{})[p.slug]||p._desc):p._desc;p.specialties=p._spec.map(tr);p.seasonal_foods=p._seas.map(tr);});
  FRIENDS.forEach(f=>{f.name_en=ja?(f._ja||f._en):f._en;f.name_ja=ja?(f._ja?f._en:''):f._ja;f.makes=tr(f._makes);f.city=tr(f._city);f.description=ja&&f.description_ja?f.description_ja:f._desc;f.story=ja&&f.story_ja.length?f.story_ja:f._story;f.images.forEach(im=>{im.caption=ja&&f._en?im._cap.split(f._en).join(f.name_en):im._cap;});});
  buildHay();}
function applyStatic(){document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t,e.dataset.ja));document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));}

const state={layout:'list',showFilters:false,open:F['yamada-seiyu']?'yamada-seiyu':(FRIENDS[0]||{}).slug||null,openI:0,view:'directory',q:'',tags:new Set(),sort:'no',order:shuffle(FRIENDS.map(f=>f.slug)),sel:null,preview:null};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- matching ---------- */
const hay={};function buildHay(){FRIENDS.forEach(f=>{const p=P[f.prefecture];hay[f.slug]=[f._en,f._ja,f._city,f.city,p._en,p._ja,p.region,tr(p.region),f.category,tr(f.category),f._makes,f.makes,...f.specialties,...f.ingredients,...f.tags,...f.tags.map(tr),...f.methods].join(' ').toLowerCase();});}
function tagLabel(k){const [t,v]=k.split(':');return t==='place'?P[v].name_en:tr(v);}
function hasTag(f,k){const [t,v]=k.split(':');if(t==='type')return f.category===v;if(t==='place')return f.prefecture===v;return f.tags.includes(v)||f.ingredients.includes(v);}
function matches(f){for(const k of state.tags)if(!hasTag(f,k))return false;const q=state.q.trim().toLowerCase();return !q||q.split(/\s+/).every(w=>hay[f.slug].includes(w));}
function filtered(){let list=FRIENDS.filter(matches);
  if(state.sort==='no')list.sort((a,b)=>a.id-b.id);
  else if(state.sort==='az')list.sort((a,b)=>a.name_en.localeCompare(b.name_en));
  else if(state.sort==='ns')list.sort((a,b)=>b.latitude-a.latitude);
  else if(state.sort==='new')list.sort((a,b)=>b.since-a.since||b.id-a.id);
  else list.sort((a,b)=>state.order.indexOf(a.slug)-state.order.indexOf(b.slug));
  return list;}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function knownFor(p,term){ // returns matched specialty or null
  const t=term.toLowerCase().trim(); if(!t||(/^[\x00-\x7f]+$/.test(t)&&t.length<2))return null;
  const re=new RegExp('(^|[\\s-])'+reEsc(t),'i');
  let i=p._spec.findIndex(s=>re.test(s)); if(i<0)i=p.specialties.findIndex(s=>s.toLowerCase().includes(t));
  if(i<0){const fam=FAMILIES[t]; if(fam)i=p._spec.findIndex(s=>fam.includes(s.toLowerCase()));}
  return i<0?null:p.specialties[i];}
function knownTerms(){const terms=[];state.tags.forEach(k=>{if(k.startsWith('food:'))terms.push(k.slice(5));});if(state.q.trim())terms.push(state.q.trim());return terms;}
function knownPrefs(terms){if(!terms.length)return [];return PREFS.map(p=>{const hits=terms.map(t=>knownFor(p,t)).filter(Boolean);return hits.length===terms.length?{p,hit:hits[0]}:null;}).filter(Boolean);}

/* ---------- geo ---------- */
let GEO=null;
const MAIN={type:'MultiPoint',coordinates:[[128.4,30.7],[146.0,45.6]]};
const OKI={type:'MultiPoint',coordinates:[[122.9,24.0],[128.4,27.0]]};
async function loadGeo(){
  const t=window.JAPAN_TOPO||await (await fetch('assets/japan.topojson')).json();const obj=t.objects.japan;
  const fc=topojson.feature(t,obj);
  fc.features.forEach(ft=>{const p=PREFS[ft.properties.id-1];p.feature=ft;const c=d3.geoCentroid(ft);p.coordinates=[+c[1].toFixed(2),+c[0].toFixed(2)];});
  const nb=topojson.neighbors(obj.geometries);
  obj.geometries.forEach((g,i)=>{PREFS[g.properties.id-1].neighbors=nb[i].map(j=>PREFS[obj.geometries[j].properties.id-1].slug);});
  [['hokkaido','aomori'],['okinawa','kagoshima'],['kagawa','okayama'],['ehime','hiroshima'],['tokushima','hyogo'],['fukuoka','yamaguchi']].forEach(([a,b])=>{if(!P[a].neighbors.includes(b))P[a].neighbors.push(b);if(!P[b].neighbors.includes(a))P[b].neighbors.push(a);});
  GEO=fc.features;
  FRIENDS.forEach(f=>{if(f.latitude==null||f.longitude==null){const c=P[f.prefecture].coordinates;f.latitude=c[0];f.longitude=c[1];}});
}
function projs(w,h,pad){
  const main=d3.geoMercator().fitExtent([[pad,pad],[w-pad,h-pad]],MAIN);
  const iw=Math.min(w*.34,240),ih=iw*.58,ix=pad,iy=pad;
  const oki=d3.geoMercator().fitExtent([[ix+8,iy+18],[ix+iw-8,iy+ih-8]],OKI);
  return {main,oki,box:[ix,iy,iw,ih]};
}
const projFor=(pr,slug)=>slug==='okinawa'?pr.oki:pr.main;
function miniMap(w,h,{hl=null,pts=[]}={}){
  const pr=projs(w,h,10),gm=d3.geoPath(pr.main),go=d3.geoPath(pr.oki);
  const paths=GEO.map(ft=>{const p=PREFS[ft.properties.id-1];const d=(p.slug==='okinawa'?go:gm)(ft);
    const fill=p.slug===hl?'var(--cf-black)':(p.friends.length?'rgba(67,47,41,.12)':'var(--cf-bone)');
    return `<path d="${d}" fill="${fill}" stroke="rgba(67,47,41,.55)" stroke-width=".5"/>`;}).join('');
  const [bx,by,bw,bh]=pr.box;

let mapBuilt=false,mapSel=null;
const tip=$('#tip');
function tipShow(e,html){tip.innerHTML=html;tip.style.display='block';tipMove(e);}
function tipMove(e){if(tip.style.display!=='block')return;let x=e.clientX+16,y=e.clientY+16;const r=tip.getBoundingClientRect();if(x+r.width>innerWidth-8)x=e.clientX-r.width-16;if(y+r.height>innerHeight-8)y=e.clientY-r.height-16;tip.style.left=x+'px';tip.style.top=y+'px';}

function buildMap(){
  const box=$('#mapbox');const w=box.clientWidth,h=Math.round(Math.max(520,Math.min(860,innerHeight*.82,w*1.05)));
  const pr=projs(w,h,24),gm=d3.geoPath(pr.main),go=d3.geoPath(pr.oki);
  d3.select(box).select('svg').remove();
  const svg=d3.select(box).insert('svg',':first-child').attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);
  const g=svg.append('g');
  [30,35,40,45].forEach(la=>{const a=pr.main([127,la]),b=pr.main([147,la]);g.append('line').attr('class','grat').attr('x1',a[0]).attr('x2',b[0]).attr('y1',a[1]).attr('y2',b[1]);g.append('text').attr('class','glab').attr('x',w-10).attr('y',a[1]-4).attr('text-anchor','end').text(la+'°N');});
  [130,135,140,145].forEach(lo=>{const a=pr.main([lo,29]),b=pr.main([lo,47]);g.append('line').attr('class','grat').attr('x1',a[0]).attr('x2',b[0]).attr('y1',a[1]).attr('y2',b[1]);g.append('text').attr('class','glab').attr('x',a[0]+4).attr('y',h-10).text(lo+'°E');});
  const [bx,by,bw,bh]=pr.box;
  g.append('rect').attr('class','inset').attr('x',bx).attr('y',by).attr('width',bw).attr('height',bh).attr('fill','var(--cf-bone)');
  g.append('text').attr('class','glab').attr('x',bx+8).attr('y',by+13).text(T('OKINAWA 沖縄県 · INSET','沖縄県'));
  const paths=g.append('g').selectAll('path').data(GEO).join('path').attr('class',d=>'pref'+(PREFS[d.properties.id-1].friends.length?' has':'')).attr('d',d=>(d.properties.id===47?go:gm)(d))
    .on('mouseenter',(e,d)=>{const p=PREFS[d.properties.id-1];tipShow(e,`<div class="t">${p.name_en} ${p.name_ja}</div><div class="s">${T('Known for: ','名産：')}${p.specialties.join(' · ')}</div><div class="s" style="opacity:.75">${p.friends.length?fc(p.friends.length):T('No Friends yet','まだ友人はいません')}</div>`);})
    .on('mousemove',tipMove).on('mouseleave',tipHide)
    .on('click',(e,d)=>{tipHide();A.mapPref(PREFS[d.properties.id-1].slug);});
  const dy=new Map(FRIENDS.map(f=>[f.slug,projFor(pr,f.prefecture)([f.longitude,f.latitude])[1]]));
  const dOrder=[...FRIENDS].sort((a,b)=>dy.get(a.slug)-dy.get(b.slug)).map(f=>f.slug);
  const dots=g.append('g').selectAll('g').data(FRIENDS).join('g').attr('class','dot')
    .style('opacity',0)
    .each(function(f){const el=this;setTimeout(()=>{el.style.opacity=1;},250+dOrder.indexOf(f.slug)*90);})
    .attr('transform',f=>{const [x,y]=projFor(pr,f.prefecture)([f.longitude,f.latitude]);return `translate(${x},${y})`;})
    .on('mouseenter',(e,f)=>tipShow(e,`<div class="t">${esc(f.name_en)}</div><div>${f.name_ja}</div><div class="s">${esc(f.makes)}</div><div class="s" style="opacity:.75">${esc(f.city)}</div><div class="tth">${f.images.slice(0,3).map(im=>im.src?media(im.src):`<span></span>`).join('')}</div>`))
    .on('mousemove',tipMove).on('mouseleave',tipHide)
    .on('click',(e,f)=>{tipHide();A.friend(f.slug);});
  dots.append('circle');
  mapSel={paths,dots};mapBuilt=true;
}

/* ---------- friend profile ---------- */
function related(f){
  const out=[],add=s=>{if(s!==f.slug&&!out.includes(s))out.push(s);};
  (f.works_with||[]).forEach(add);
  FRIENDS.filter(o=>(o.works_with||[]).includes(f.slug)).forEach(o=>add(o.slug));
  P[f.prefecture].friends.forEach(add);
  FRIENDS.map(o=>({o,s:o.tags.filter(t=>f.tags.includes(t)).length+(o.region===f.region?.5:0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).forEach(x=>add(x.o.slug));
  return out.slice(0,4).map(s=>F[s]);
}

const onExplore=()=>mounted;
window.A={
  friend:s=>{location.hash='#/friend/'+s;},
  lang:l=>{if(l===LANG)return;LANG=l;localStorage.setItem('cf_lang',l);applyLangData();applyStatic();const y=scrollY;mounted=false;mapBuilt=false;route();window.scrollTo(0,y);},
  tag:(k)=>{if(!onExplore()){state.tags=new Set([k]);state.q='';location.hash='#/directory';return;}state.tags.has(k)?state.tags.delete(k):state.tags.add(k);state.preview=null;renderTags();update();},
  term:(t)=>{const k='food:'+t;state.tags.clear();state.sel=null;if(FOODS.includes(t)){state.tags.add(k);state.q='';}else state.q=t;
    if(onExplore()){$('#q').value=state.q;renderTags();update();window.scrollTo({top:$('.search').offsetTop-10,behavior:'smooth'});}else location.hash=state.view==='map'?'#/map':'#/directory';},
  clearQ:()=>{state.q='';$('#q').value='';update();},
  clearAll:()=>{state.q='';state.tags.clear();if($('#q'))$('#q').value='';update();},
  random:()=>{const cur=(location.hash.match(/friend\/([^/?]+)/)||[])[1];const pool=FRIENDS.filter(f=>f.slug!==cur);location.hash='#/friend/'+pool[Math.floor(Math.random()*pool.length)].slug;},
  randomPref:()=>{A.mapPref(PREFS[Math.floor(Math.random()*47)].slug);},
  mapPref:s=>{history.replaceState(null,'','#/map'+(s?'/'+s:''));state.sel=s;state.view='map';if(onExplore())update();else route();},
  pv:k=>{state.preview=k;applyPreview();},
  toggleFilters:()=>{state.showFilters=!state.showFilters;update();},
  openEnt:s=>{const el=document.querySelector(`.ent[data-slug="${s}"] .th`);A.openFig(el,s,0);},
  openFig:(el,s,i)=>{

    dp.classList.remove('on','out');dp.innerHTML=panelHTML(f,i);dp.scrollTop=0;void dp.offsetWidth;dp.classList.add('on');
    const tgt=dp.querySelector('.dp-im');tgt.querySelector('img')?.classList.add('ld');if(!el)return;
    const st=el.closest('.strip');if(st){const ent=st.closest('.ent');ent.classList.add('stair');const ths=[...st.querySelectorAll('.th')];
      ths.forEach((t,k)=>{const d=(ths.length-1-k)*260;
        t.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.6,0)',opacity:.4}],{duration:420,delay:d,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'});});
      setTimeout(()=>{ent.classList.remove('stair');ths.forEach(t=>{t.getAnimations().forEach(a=>a.cancel());t.style.visibility='';});},1100);}
    const a=(el.querySelector('img,video,.ph2')||el).getBoundingClientRect(),b=tgt.getBoundingClientRect();
    const cl=tgt.cloneNode(true);cl.classList.add('fly');document.body.appendChild(cl);tgt.style.visibility='hidden';
    const fr=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    Object.assign(cl.style,fr(b),{aspectRatio:'auto',overflow:'hidden'});const ci=cl.querySelector('img,video');if(ci){ci.style.width='100%';ci.style.height='100%';ci.style.objectFit='cover';}
    const an=cl.animate([fr(a),fr(b)],{duration:620,easing:'cubic-bezier(.22,1,.36,1)'});
    an.onfinish=an.oncancel=()=>{tgt.style.visibility='';cl.remove();};
  },
  closeFig:()=>{const dp=$('#dp');if(!dp||!state.open)return;state.open=null;$('#dl').classList.remove('has-sel');document.querySelectorAll('.ent.sel').forEach(e=>e.classList.remove('sel'));document.querySelectorAll('.fly').forEach(x=>x.remove());dp.innerHTML='';dp.classList.remove('on','out');},
  moreFood:()=>{state.allFood=!state.allFood;renderTags();update();},
  peek:(e,s)=>peekShow(e,s),peekMove:e=>peekMove(e),unpeek:()=>{peek.style.display='none';},
  files:inp=>{$('#phl').textContent=[...inp.files].slice(0,6).map(f=>f.name).join(' · ');},
  submit:async e=>{e.preventDefault();const form=e.target,d=new FormData(form),btn=form.querySelector('button[type=submit]'),err=$('#serr');
    if(btn.disabled)return false;
    const files=[...($('#ph')?.files||[])].slice(0,6);
    if(files.some(f=>f.size>10*1024*1024)){err.textContent=T('Each photo needs to be under 10 MB.','写真は1枚10MB以内でお願いします。');return false;}
    const label=btn.innerHTML;btn.disabled=true;btn.innerHTML=T('Sending…','送信中…');err.textContent='';
    try{
      const body=Object.fromEntries(d);body.who=$('#who .on')?.dataset.w||'self';body.lang=LANG;body.photos=files.map(f=>({type:f.type,size:f.size}));
      const post=b=>fetch(window.CF_API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
      const r=await post(body),j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||'failed');
      // Photos go straight to private storage via the signed URLs the server issued; one failed photo doesn't lose the submission.
      await Promise.all((j.uploads||[]).map((u,i)=>{if(!u)return;const fd=new FormData();fd.append('cacheControl','3600');fd.append('',files[i]);return fetch(u.url,{method:'PUT',body:fd,headers:{'x-upsert':'false'}}).catch(x=>console.error(x));}));
      if(j.id)await post({done:j.id,key:j.key}).catch(x=>console.error(x));
    }catch(x){console.error(x);btn.disabled=false;btn.innerHTML=label;
      err.textContent=x.message==='missing_fields'?T('Please add your name, the business name, the prefecture and a valid email.','お名前、屋号、都道府県、有効なメールアドレスをご記入ください。')
        :x.message==='too_many'?T('We’ve received several submissions from you already. Please try again in an hour.','すでに複数の応募を受け付けています。1時間ほどしてから再度お試しください。')
        :T('Something went wrong and nothing was sent. Please try again.','送信できませんでした。もう一度お試しください。');
      return false;}
    app.innerHTML=`<section class="wrap empty" style="padding:96px var(--pad)"><div class="meta mute">${T('Received · ありがとうございます','受け付けました')}</div><p style="font-size:32px;max-width:24ch;line-height:1.2">${T('Thank you. We’ll read about '+esc(d.get('business')||'them')+' soon.','ありがとうございます。'+esc(d.get('business')||'')+'について、近いうちに拝読します。')}</p><p class="mute" style="font-size:15px">${T('Cabi &amp; Friends is curated, so we can’t include everyone. If there’s a fit, we’ll write to '+esc(d.get('email'))+'.','Cabi &amp; Friendsは編集されたディレクトリのため、すべての方を掲載することはできません。ご縁がありそうな場合は、'+esc(d.get('email'))+'へご連絡します。')}</p><div class="ctrls"><a class="btn" href="#/directory">${T('Back to the directory','一覧に戻る')}</a><button class="btn ghost" onclick="A.random()">${T('Random Friend ↝','ランダムな友人 ↝')}</button></div></section>`;window.scrollTo(0,0);return false;}
};

/* ---------- router ---------- */
function route(){
  const [path,qs]=location.hash.replace(/^#\/?/,'').split('?');
  const parts=path.split('/').filter(Boolean).map(decodeURIComponent);const params=new URLSearchParams(qs||'');
  const r=parts[0]||'directory';
  document.querySelectorAll('#nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  peek.style.display='none';tipHide();
  if(r==='directory'||r==='map'){
    state.view=r;if(r==='map')state.sel=parts[1]&&P[parts[1]]?parts[1]:null;
    if(!mounted){mountExplore();window.scrollTo(0,0);}
    update();return;
  }
  mounted=false;mapBuilt=false;window.scrollTo(0,0);
  if(r==='friend')renderFriend(parts[1]);else if(r==='pref')renderPref(parts[1]);else if(r==='submit')renderSubmit(params);else if(r==='about')renderAbout();else notFound();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'&&$('#q')){e.preventDefault();$('#q').focus();}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(mounted&&state.view==='map'){mapBuilt=false;update();}},200);});
addEventListener('keydown',e=>{if(e.key==='Escape'&&state.open)A.closeFig();});
const panelEnd=()=>{const p=document.getElementById('panel');if(p)p.classList.toggle('end',p.scrollHeight-p.scrollTop-p.clientHeight<6);};
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='panel')panelEnd();},true);
addEventListener('resize',panelEnd);
new MutationObserver(()=>requestAnimationFrame(panelEnd)).observe(document.getElementById('root'),{childList:true,subtree:true});
const reveal=im=>{if(im.classList.contains('ld')||im.dataset.q)return;im.dataset.q=1;setTimeout(()=>im.classList.add('ld'),80+Math.random()*420);};
document.addEventListener('load',e=>{if(e.target.tagName==='IMG'&&e.target.closest('#root'))reveal(e.target);},true);
new MutationObserver(()=>document.querySelectorAll('#root img:not(.ld)').forEach(im=>{if(im.complete&&im.naturalWidth)reveal(im);})).observe(document.getElementById('root'),{childList:true,subtree:true});
const B=document.body;
const lift=()=>{if(!B.classList.contains('intro'))return;const now=performance.now();
  if(!B.classList.contains('i1')){B.classList.add('i1');window.__t1=now;}
  setTimeout(()=>B.classList.remove('intro','i1'),Math.max(0,1200-(now-window.__t0),700-(now-window.__t1)));};
applyLangData();applyStatic();
app.innerHTML=`<div class="wrap meta mute" style="padding:60px var(--pad)">${T('Loading the archive…','読み込み中…')}</div>`;
loadGeo().then(()=>{route();lift();}).catch(err=>{console.error(err);route();lift();});
})();
</script>
</body>
